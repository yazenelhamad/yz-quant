services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yzquant
      POSTGRES_USER: yzquant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yzquant"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://yzquant:${POSTGRES_PASSWORD}@db:5432/yzquant
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?openssl rand -base64 32}
      SESSION_SECRET: ${SESSION_SECRET:?openssl rand -base64 32}
      APP_ORIGIN: ${APP_ORIGIN:?https origin of the dashboard}
      API_ORIGIN: ${API_ORIGIN:?https origin of the API}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - "8787:8787"
volumes:
  pgdata:
